name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parity-and-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: "**/go.sum"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked ONNX Runtime shared library
        run: |
          cd 01-delivery-sla-breach/ml
          uv sync --frozen --no-install-project

      - name: Verify contract codegen has zero drift (GOWORK=off)
        run: |
          make generate-all
          git diff --exit-code

      - name: Run all 7 Python <-> Go parity & CI eval suites (GOWORK=off)
        run: make test-all
