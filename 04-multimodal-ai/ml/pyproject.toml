[project]
name = "04-multimodal-ai-ml"
version = "0.1.0"
description = "Multimodal Vision, Audio VAD, and Video benchmark & ONNX exporter"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.29.5",
    "kagglehub>=0.3.4",
    "matplotlib>=3.9.2",
    "nbconvert>=7.16.6",
    "numpy>=2.1.0",
    "onnx>=1.17.0",
    "onnxruntime>=1.20.0",
    "pandas>=2.2.3",
    "pillow>=11.0.0",
    "scikit-learn>=1.5.2",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
