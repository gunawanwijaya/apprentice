[project]
name = "ml"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Gunawan Wijaya", email = "gunawan@wijaya.cc" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
