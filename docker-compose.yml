services:
  pgvector:
    image: pgvector/pgvector:pg19
    container_name: apprentice-pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apprentice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apprentice_dev}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apprentice} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    container_name: apprentice-rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-${MINIO_ROOT_USER:-apprentice}}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-apprentice_secret_123}}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_ENDPOINT: "http://lgtm:4318"
    ports:
      - "9000:9000" # S3 API (+ /health)
      - "9001:9001" # Web Console
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: apprentice-lgtm
    depends_on:
      pgvector:
        condition: service_healthy
    environment:
      ENABLE_LOGS_ALL: true
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/dashboards/apprentice-stack.json
      POSTGRES_USER: ${POSTGRES_USER:-apprentice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apprentice_dev}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - lgtm_data:/data
      - ./infra/lgtm/otelcol-config.yaml:/otel-lgtm/otelcol-config.yaml:ro
      - ./infra/lgtm/dashboards-provisioning.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/apprentice.yaml:ro
      - ./infra/lgtm/dashboards:/otel-lgtm/dashboards:ro

volumes:
  pgvector_data:
  rustfs_data:
  lgtm_data:
